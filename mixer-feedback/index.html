<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合格者交流会 アンケート | Tokyo IPUT</title>
    <meta name="description" content="合格者交流会の感想をお聞かせください。">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Admin Button -->
    <button id="adminBtn" class="admin-btn" title="管理者モード">
        <i class="fa-solid fa-shield-halved"></i>
    </button>

    <main class="container">
        <header class="header">
            <div class="logo-area">
                <span class="logo-text">WELCOME TO IPUT</span>
            </div>
            <h1 class="title">合格者交流会<br>感想フォーム</h1>
            <p class="subtitle">本日はご参加ありがとうございました！<br>これからの学生生活をより良くするために、<br>ぜひあなたの声をお聞かせください。</p>
        </header>

        <form id="feedbackForm" class="glass-card">

            <!-- Name -->
            <div class="form-group">
                <label for="name" class="form-label">お名前 <span class="badge-required">必須</span></label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="name" name="name" placeholder="山田 太郎" required>
                </div>
            </div>



            <!-- Department -->
            <div class="form-group">
                <label class="form-label">学科選択 <span class="badge-required">必須</span></label>
                <div class="radio-group">
                    <label class="radio-card">
                        <input type="radio" name="department" value="IT" required>
                        <span class="radio-content">
                            <i class="fa-solid fa-laptop-code"></i>
                            <span class="dept-name">情報工学科</span>
                        </span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="department" value="DE">
                        <span class="radio-content">
                            <i class="fa-solid fa-vr-cardboard"></i>
                            <span class="dept-name">デジタルエンタテインメント学科</span>
                        </span>
                    </label>
                </div>
            </div>

            <!-- Satisfaction Rating -->
            <div class="form-group">
                <label class="form-label">交流会の満足度 <span class="badge-required">必須</span></label>
                <div class="rating-container">
                    <div class="stars" id="starContainer">
                        <i class="fa-regular fa-star" data-value="1"></i>
                        <i class="fa-regular fa-star" data-value="2"></i>
                        <i class="fa-regular fa-star" data-value="3"></i>
                        <i class="fa-regular fa-star" data-value="4"></i>
                        <i class="fa-regular fa-star" data-value="5"></i>
                    </div>
                    <input type="hidden" name="satisfaction" id="satisfaction" required>
                    <p class="rating-text" id="ratingText">選択してください</p>
                </div>
            </div>

            <!-- Best Part -->
            <div class="form-group">
                <label for="bestPart" class="form-label">最も印象に残ったこと <span class="badge-optional">任意</span></label>
                <div class="input-wrapper textarea-wrapper">
                    <textarea id="bestPart" name="bestPart" placeholder="先輩の話が面白かった、キャンパスが綺麗だった、など" rows="3"></textarea>
                </div>
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message" class="form-label">今後の抱負・メッセージ <span class="badge-optional">任意</span></label>
                <div class="input-wrapper textarea-wrapper">
                    <textarea id="message" name="message" placeholder="入学後の目標や、楽しみにしていることなど自由にお書きください"
                        rows="4"></textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="form-actions">
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">送信する</span>
                    <i class="fa-solid fa-paper-plane btn-icon"></i>
                    <div class="loading-spinner"></div>
                </button>
            </div>
        </form>

        <footer class="footer">
            <p>&copy; 2026 Tokyo IPUT</p>
        </footer>
    </main>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content glass-card">
            <div class="modal-icon">
                <i class="fa-solid fa-check-circle"></i>
            </div>
            <h2>Thank You!</h2>
            <p>送信ありがとうございました。<br>4月にお会いできるのを楽しみにしています！</p>
            <button id="closeModalBtn" class="primary-btn">閉じる</button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content glass-card admin-modal-content">
            <div class="modal-icon admin-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>管理者認証</h2>
            <p id="adminModalMessage">パスワードを入力してください</p>
            <div class="admin-input-wrapper">
                <input type="password" id="adminPassword" placeholder="パスワード" autocomplete="off">
            </div>
            <p id="attemptWarning" class="attempt-warning"></p>
            <div class="admin-btn-group">
                <button id="adminCancelBtn" class="secondary-btn">キャンセル</button>
                <button id="adminLoginBtn" class="primary-btn">ログイン</button>
            </div>
        </div>
    </div>

    <!-- Spreadsheet Link (Admin Mode Only) -->
    <a href="https://docs.google.com/spreadsheets/d/18dlXrMzdWa_-ArmJ5ODcB2UxhZZjFeY6x-QBnbzbTxI/edit?usp=sharing"
        target="_blank" class="spreadsheet-link-btn" id="spreadsheetLink">
        <i class="fa-solid fa-table"></i>
        <span>スプレッドシートを開く</span>
    </a>

    <script src="script.js"></script>
</body>

</html>
